name: Pluto CI

on:
  push:
    branches: [master, 'dev/**', 'v*']
  pull_request:
    branches: [master, 'v*']

jobs:
  erlang-tests:
    name: Erlang Tests (OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        otp: ['28']
    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang/OTP ${{ matrix.otp }}
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.24'

      - name: Compile
        working-directory: src_erl
        run: rebar3 compile

      - name: Run EUnit tests
        working-directory: src_erl
        run: rebar3 eunit

  python-tests:
    name: Python Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt pytest

      # tests/conftest.py gates the live-server modules and demo_* demos
      # behind PLUTO_LIVE_TESTS=1, so the whole tree is safe to run here.
      # This covers the MCP adapter suite plus test_agent_friend.py.
      - name: Run the Python test suite
        run: python -m pytest tests/ -v

  python-lint:
    name: Python Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check syntax
        working-directory: src_py
        run: python -m compileall -q pluto_client.py pluto_client_def.py pluto_sdk
